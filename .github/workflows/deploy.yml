name: 인프라 자동 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      kafka:      ${{ steps.changes.outputs.kafka }}
      redis:      ${{ steps.changes.outputs.redis }}
      monitoring: ${{ steps.changes.outputs.monitoring }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            kafka:
              - 'kafka-vm/**'
              - '.github/workflows/deploy.yml'
            redis:
              - 'redis-vm/**'
              - '.github/workflows/deploy.yml'
            monitoring:
              - 'monitoring-vm/**'
              - '.github/workflows/deploy.yml'

  deploy-kafka:
    needs: detect-changes
    if: needs.detect-changes.outputs.kafka == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SCP 전송 준비 (ssl 제외)
        run: rm -rf kafka-vm/ssl

      - name: 필수 변수 확인
        run: |
          missing=()
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]      && missing+=("secrets.SSH_PRIVATE_KEY")
          [ -z "${{ secrets.SSH_USER }}" ]              && missing+=("secrets.SSH_USER")
          [ -z "${{ secrets.KAFKA_1_VM_HOST }}" ]       && missing+=("secrets.KAFKA_1_VM_HOST")
          [ -z "${{ secrets.KAFKA_CLUSTER_ID }}" ]      && missing+=("secrets.KAFKA_CLUSTER_ID")
          [ -z "${{ secrets.KAFKA_1_INTERNAL_IP }}" ]   && missing+=("secrets.KAFKA_1_INTERNAL_IP")
          [ -z "${{ secrets.KAFKA_2_INTERNAL_IP }}" ]   && missing+=("secrets.KAFKA_2_INTERNAL_IP")
          [ -z "${{ secrets.KAFKA_3_INTERNAL_IP }}" ]   && missing+=("secrets.KAFKA_3_INTERNAL_IP")
          [ -z "${{ secrets.TRUST_STORE_PASSWORD }}" ]  && missing+=("secrets.TRUST_STORE_PASSWORD")
          [ -z "${{ secrets.MONITORING_VM_HOST }}" ]    && missing+=("secrets.MONITORING_VM_HOST")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ 누락된 변수/시크릿:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "✅ 모든 변수 확인 완료"

      - name: Kafka-1 .env 생성
        run: |
          cat > kafka-vm/.env << EOF
          KAFKA_CLUSTER_ID=${{ secrets.KAFKA_CLUSTER_ID }}
          BROKER_ID=1
          KAFKA_HOST=${{ secrets.KAFKA_1_INTERNAL_IP }}
          KAFKA_1_HOST=${{ secrets.KAFKA_1_INTERNAL_IP }}
          KAFKA_2_HOST=${{ secrets.KAFKA_2_INTERNAL_IP }}
          KAFKA_3_HOST=${{ secrets.KAFKA_3_INTERNAL_IP }}
          BROKER_KEYSTORE_FILENAME=broker-1.keystore.jks
          LOKI_HOST=${{ secrets.MONITORING_VM_HOST }}
          TRUSTSTORE_PASSWORD=${{ secrets.TRUST_STORE_PASSWORD }}
          EOF

      - name: Kafka-1 디렉토리 생성
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KAFKA_1_VM_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/infra

      - name: Kafka-1 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.KAFKA_1_VM_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "kafka-vm"
          target: "~/infra"

      - name: Kafka-1 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KAFKA_1_VM_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: cd ~/infra/kafka-vm && docker compose pull && docker compose up -d

      - name: Kafka-2 .env 생성
        run: |
          cat > kafka-vm/.env << EOF
          KAFKA_CLUSTER_ID=${{ secrets.KAFKA_CLUSTER_ID }}
          BROKER_ID=2
          KAFKA_HOST=${{ secrets.KAFKA_2_INTERNAL_IP }}
          KAFKA_1_HOST=${{ secrets.KAFKA_1_INTERNAL_IP }}
          KAFKA_2_HOST=${{ secrets.KAFKA_2_INTERNAL_IP }}
          KAFKA_3_HOST=${{ secrets.KAFKA_3_INTERNAL_IP }}
          BROKER_KEYSTORE_FILENAME=broker-2.keystore.jks
          LOKI_HOST=${{ secrets.MONITORING_VM_HOST }}
          TRUSTSTORE_PASSWORD=${{ secrets.TRUST_STORE_PASSWORD }}
          EOF

      - name: Kafka-2 디렉토리 생성
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KAFKA_2_INTERNAL_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.KAFKA_1_VM_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/infra

      - name: Kafka-2 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.KAFKA_2_INTERNAL_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.KAFKA_1_VM_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "kafka-vm"
          target: "~/infra"

      - name: Kafka-2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KAFKA_2_INTERNAL_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.KAFKA_1_VM_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: cd ~/infra/kafka-vm && docker compose pull && docker compose up -d

      - name: Kafka-3 .env 생성
        run: |
          cat > kafka-vm/.env << EOF
          KAFKA_CLUSTER_ID=${{ secrets.KAFKA_CLUSTER_ID }}
          BROKER_ID=3
          KAFKA_HOST=${{ secrets.KAFKA_3_INTERNAL_IP }}
          KAFKA_1_HOST=${{ secrets.KAFKA_1_INTERNAL_IP }}
          KAFKA_2_HOST=${{ secrets.KAFKA_2_INTERNAL_IP }}
          KAFKA_3_HOST=${{ secrets.KAFKA_3_INTERNAL_IP }}
          BROKER_KEYSTORE_FILENAME=broker-3.keystore.jks
          LOKI_HOST=${{ secrets.MONITORING_VM_HOST }}
          TRUSTSTORE_PASSWORD=${{ secrets.TRUST_STORE_PASSWORD }}
          EOF

      - name: Kafka-3 디렉토리 생성
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KAFKA_3_INTERNAL_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.KAFKA_1_VM_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/infra

      - name: Kafka-3 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.KAFKA_3_INTERNAL_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.KAFKA_1_VM_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "kafka-vm"
          target: "~/infra"

      - name: Kafka-3 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KAFKA_3_INTERNAL_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.KAFKA_1_VM_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: cd ~/infra/kafka-vm && docker compose pull && docker compose up -d

  deploy-redis:
    needs: detect-changes
    if: needs.detect-changes.outputs.redis == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 필수 변수 확인
        run: |
          missing=()
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]      && missing+=("secrets.SSH_PRIVATE_KEY")
          [ -z "${{ secrets.SSH_USER }}" ]              && missing+=("secrets.SSH_USER")
          [ -z "${{ secrets.REDIS_1_VM_HOST }}" ]       && missing+=("secrets.REDIS_1_VM_HOST")
          [ -z "${{ secrets.REDIS_PASSWORD }}" ]        && missing+=("secrets.REDIS_PASSWORD")
          [ -z "${{ secrets.REDIS_1_INTERNAL_IP }}" ]   && missing+=("secrets.REDIS_1_INTERNAL_IP")
          [ -z "${{ secrets.REDIS_2_INTERNAL_IP }}" ]   && missing+=("secrets.REDIS_2_INTERNAL_IP")
          [ -z "${{ secrets.REDIS_3_INTERNAL_IP }}" ]   && missing+=("secrets.REDIS_3_INTERNAL_IP")
          [ -z "${{ secrets.MONITORING_VM_HOST }}" ]    && missing+=("secrets.MONITORING_VM_HOST")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ 누락된 변수/시크릿:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "✅ 모든 변수 확인 완료"

      - name: Redis-1 .env 생성 (master)
        run: |
          cat > redis-vm/.env << EOF
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_MASTER_HOST=${{ secrets.REDIS_1_INTERNAL_IP }}
          SENTINEL_HOST=${{ secrets.REDIS_1_INTERNAL_IP }}
          LOKI_HOST=${{ secrets.MONITORING_VM_HOST }}
          EOF

      - name: Redis-1 디렉토리 생성
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REDIS_1_VM_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/infra

      - name: Redis-1 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REDIS_1_VM_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "redis-vm"
          target: "~/infra"

      - name: Redis-1 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REDIS_1_VM_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: cd ~/infra/redis-vm && docker compose pull && docker compose --profile master up -d

      - name: Redis-2 .env 생성 (replica)
        run: |
          cat > redis-vm/.env << EOF
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_MASTER_HOST=${{ secrets.REDIS_1_INTERNAL_IP }}
          SENTINEL_HOST=${{ secrets.REDIS_2_INTERNAL_IP }}
          LOKI_HOST=${{ secrets.MONITORING_VM_HOST }}
          EOF

      - name: Redis-2 디렉토리 생성
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REDIS_2_INTERNAL_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.REDIS_1_VM_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/infra

      - name: Redis-2 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REDIS_2_INTERNAL_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.REDIS_1_VM_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "redis-vm"
          target: "~/infra"

      - name: Redis-2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REDIS_2_INTERNAL_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.REDIS_1_VM_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: cd ~/infra/redis-vm && docker compose pull && docker compose --profile replica up -d

      - name: Redis-3 .env 생성 (replica)
        run: |
          cat > redis-vm/.env << EOF
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_MASTER_HOST=${{ secrets.REDIS_1_INTERNAL_IP }}
          SENTINEL_HOST=${{ secrets.REDIS_3_INTERNAL_IP }}
          LOKI_HOST=${{ secrets.MONITORING_VM_HOST }}
          EOF

      - name: Redis-3 디렉토리 생성
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REDIS_3_INTERNAL_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.REDIS_1_VM_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/infra

      - name: Redis-3 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REDIS_3_INTERNAL_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.REDIS_1_VM_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "redis-vm"
          target: "~/infra"

      - name: Redis-3 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REDIS_3_INTERNAL_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.REDIS_1_VM_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: cd ~/infra/redis-vm && docker compose pull && docker compose --profile replica up -d

  deploy-monitoring:
    needs: detect-changes
    if: needs.detect-changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 필수 변수 확인
        run: |
          missing=()
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]      && missing+=("secrets.SSH_PRIVATE_KEY")
          [ -z "${{ secrets.SSH_USER }}" ]              && missing+=("secrets.SSH_USER")
          [ -z "${{ secrets.MONITORING_VM_HOST }}" ]    && missing+=("secrets.MONITORING_VM_HOST")
          [ -z "${{ secrets.GRAFANA_PASSWORD }}" ]      && missing+=("secrets.GRAFANA_PASSWORD")
          [ -z "${{ secrets.TRUST_STORE_PASSWORD }}" ]  && missing+=("secrets.TRUST_STORE_PASSWORD")
          [ -z "${{ secrets.TRUSTSTORE_JKS_B64 }}" ]   && missing+=("secrets.TRUSTSTORE_JKS_B64")
          [ -z "${{ secrets.KAFKA_1_INTERNAL_IP }}" ]   && missing+=("secrets.KAFKA_1_INTERNAL_IP")
          [ -z "${{ secrets.KAFKA_2_INTERNAL_IP }}" ]   && missing+=("secrets.KAFKA_2_INTERNAL_IP")
          [ -z "${{ secrets.KAFKA_3_INTERNAL_IP }}" ]   && missing+=("secrets.KAFKA_3_INTERNAL_IP")
          [ -z "${{ secrets.REDIS_1_INTERNAL_IP }}" ]   && missing+=("secrets.REDIS_1_INTERNAL_IP")
          [ -z "${{ secrets.REDIS_2_INTERNAL_IP }}" ]   && missing+=("secrets.REDIS_2_INTERNAL_IP")
          [ -z "${{ secrets.REDIS_3_INTERNAL_IP }}" ]   && missing+=("secrets.REDIS_3_INTERNAL_IP")
          [ -z "${{ secrets.VM_HOST }}" ]               && missing+=("secrets.VM_HOST")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ 누락된 변수/시크릿:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "✅ 모든 변수 확인 완료"

      - name: 모니터링 .env 생성
        run: |
          cat > monitoring-vm/.env << EOF
          GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
          TRUSTSTORE_PASSWORD=${{ secrets.TRUST_STORE_PASSWORD }}
          KAFKA_1_HOST=${{ secrets.KAFKA_1_INTERNAL_IP }}
          KAFKA_2_HOST=${{ secrets.KAFKA_2_INTERNAL_IP }}
          KAFKA_3_HOST=${{ secrets.KAFKA_3_INTERNAL_IP }}
          REDIS_1_HOST=${{ secrets.REDIS_1_INTERNAL_IP }}
          REDIS_2_HOST=${{ secrets.REDIS_2_INTERNAL_IP }}
          REDIS_3_HOST=${{ secrets.REDIS_3_INTERNAL_IP }}
          MENTORING_SERVICE_HOST=${{ secrets.VM_HOST }}
          ORDER_SERVICE_HOST=${{ secrets.VM_HOST }}
          LECTURE_SERVICE_HOST=${{ secrets.VM_HOST }}
          PAYMENT_SERVICE_HOST=${{ secrets.VM_HOST }}
          USER_SERVICE_HOST=${{ secrets.VM_HOST }}
          SERVICE_HOST=${{ secrets.VM_HOST }}
          EOF

      - name: 모니터링 SSL truststore 복원
        run: |
          mkdir -p monitoring-vm/ssl
          echo "${{ secrets.TRUSTSTORE_JKS_B64 }}" | base64 -d > monitoring-vm/ssl/kafka.truststore.jks

      - name: 모니터링 디렉토리 생성
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MONITORING_VM_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/infra

      - name: 모니터링 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MONITORING_VM_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "monitoring-vm"
          target: "~/infra"

      - name: 모니터링 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MONITORING_VM_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: cd ~/infra/monitoring-vm && docker compose pull && docker compose up -d